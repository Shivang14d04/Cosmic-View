apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmic-view
  namespace: cosmic

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cosmic-view

  template:
    metadata:
      labels:
        app: cosmic-view

    spec:
      containers:
        - name: cosmic-view
          image: shivang125/cosmic-view:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cosmic-view-secret
                  key: MONGODB_URI

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cosmic-view-secret
                  key: JWT_SECRET

            - name: NASA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cosmic-view-secret
                  key: NASA_API_KEY

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
